
name: Inspect TÜRKAİ details

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract and inspect source
        run: |
          mkdir extracted
          unzip -q TURKAI_GUNCEL7.zip -d extracted

          echo "===== README-TR.md ====="
          cat extracted/README-TR.md

          echo "===== index.html ====="
          sed -n '1,300p' extracted/index.html

          echo "===== ses-uret.html ====="
          sed -n '1,240p' extracted/ses-uret.html

          echo "===== manifest.webmanifest ====="
          cat extracted/manifest.webmanifest
